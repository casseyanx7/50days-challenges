<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5efe4"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>Project 50</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5efe4;color:#493f33;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:22px 18px 100px}h1{font-size:32px;margin:4px 0}h2{font-size:21px}h3{margin:0 0 10px}small,.muted{color:#786e61}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#687e59;color:white}button:disabled{opacity:.4;cursor:default}button.alt{background:#e8dece;color:#493f33}input,select{min-width:0;width:100%;padding:11px;border:1px solid #d4c6b3;border-radius:10px;background:#fffaf2;color:#493f33}label{display:block;font-size:13px;margin:10px 0 5px}.card{background:#fffaf2;border:1px solid #e6dac8;border-radius:19px;padding:17px;margin:13px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eae2d3;padding:13px 8px;border-radius:13px;text-align:center}.stat b{display:block;font-size:22px}.bar{height:9px;background:#e4dac9;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#81956d}.task{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #eee4d5}.task input{width:23px;height:23px;accent-color:#687e59;flex-shrink:0}.task span{flex:1}.task small{font-size:12px}.task.done span{text-decoration:line-through;color:#82786b}.wide{width:100%;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffaf2;border-top:1px solid #e2d5c2;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{flex:1;max-width:124px;background:none;color:#786e61;padding:7px 2px;font-size:12px}nav button.active{color:#48623c;font-weight:700}nav b{display:block;font-size:22px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.node{padding:12px 2px;text-align:center;border-radius:14px;background:#e8dece;font-size:13px}.node.passed{background:#81956d;color:white}.node.current{outline:2px solid #687e59}.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#dce4cb;padding:15px;border-radius:16px}.plot{display:grid;place-items:center;height:80px;border-radius:50%;background:#baa17f;font-size:40px}.shop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee4d5}.shop button{white-space:nowrap;font-size:13px}.tag{font-size:12px;background:#e5ecd9;color:#48623c;border-radius:20px;padding:5px 9px}.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini button{height:63px;font-size:26px}.log{font-size:14px;padding:8px 0;border-bottom:1px solid #eee4d5} .notice{background:#e7eddd;padding:12px;border-radius:12px;margin:10px 0} .danger{background:#a05b4e} .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body><main id="app"></main><nav id="nav"></nav><script>
const KEY='project50-v1';const defaults=[['Wake up on time',10,5],['Run / scheduled rest',30,15],['Workout / recovery',20,10],['Meet water goal',10,5],['Follow meal plan',20,10],['Learn for 15 minutes',15,5],['Daily reflection',10,5],['Sleep on time',15,5]];const dateKey=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fresh=()=>({name:'Project 50',start:dateKey(),duration:50,tasks:defaults.map((a,i)=>({id:'t'+i,name:a[0],xp:a[1],coins:a[2]})),days:{},plants:[],spending:[],rewards:[{name:'Fresh flowers',cost:300},{name:'Coffee outing',cost:500},{name:'Karaoke',cost:800},{name:'SPA massage',cost:1500}],records:{}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{ s=fresh() }let tab='Today',msg='',game=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayNum=(date=dateKey())=>Math.round((Date.parse(date+'T00:00:00Z')-Date.parse(s.start+'T00:00:00Z'))/86400000)+1;const active=()=>dayNum()>=1&&dayNum()<=s.duration;function today(){let k=dateKey();return s.days[k]||(s.days[k]={tasks:s.tasks.map(t=>({...t,done:false})),bonus:false,chest:false,game:false})}function totals(){let xp=0,coins=0;for(let d of Object.values(s.days)){for(let t of d.tasks)if(t.done){xp+=t.xp;coins+=t.coins}if(d.bonus){xp+=30;coins+=20}if(d.chest)coins+=20;if(d.game)coins+=15}return {xp,coins:coins-s.spending.reduce((a,b)=>a+b.cost,0)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{msg='Storage unavailable. Export a backup before closing.'}}function commit(){save();render()}function rate(d){return d&&d.tasks.length?d.tasks.filter(t=>t.done).length/d.tasks.length:0}function change(t){tab=t;msg='';render()}function toggle(i){if(!active())return;let d=today();if(d.bonus||d.chest||d.game){if(d.tasks[i].done)return}d.tasks[i].done=!d.tasks[i].done;commit()}function claim(kind){let d=today();if(!active())return;if(kind==='bonus'&&!d.bonus&&rate(d)===1&&d.tasks.length){d.bonus=true;msg='Daily quest complete! +30 XP and 20 coins'}if(kind==='chest'&&!d.chest&&d.tasks.filter(t=>t.done).length>=Math.min(4,d.tasks.length)&&d.tasks.length){d.chest=true;msg='Treasure opened! +20 coins'}commit()}function buyPlant(i){let p=plants[i];if(totals().coins<p[2]||s.plants.length>=18)return;s.plants.push(p[0]);s.spending.push({name:p[1],cost:p[2],date:dateKey()});msg='Your garden is growing!';commit()}function redeem(i){let r=s.rewards[i];if(!r||totals().coins<r.cost||!confirm('Redeem '+r.name+' for '+r.cost+' coins?'))return;s.spending.push({name:r.name,cost:r.cost,date:dateKey()});msg='Reward redeemed!';commit()}const plants=[['🌷','Tulip',10],['🌻','Sunflower',20],['🌳','Tree',30],['🪻','Lavender',25]];function startGame(){if(!active()||today().game||rate(today())<.5)return;let cards=['🌻','🌻','🍄','🍄','🌷','🌷','🍀','🍀'];for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}game={cards,open:[],matched:[],busy:false};render()}function flip(i){if(!game||game.busy||game.open.includes(i)||game.matched.includes(i))return;game.open.push(i);if(game.open.length===2){let [a,b]=game.open;if(game.cards[a]===game.cards[b]){game.matched.push(a,b);game.open=[];if(game.matched.length===8&&!today().game&&active()){today().game=true;msg='Memory game won! +15 coins';save()}}else{game.busy=true;setTimeout(()=>{if(game){game.open=[];game.busy=false;render()}},650)}}render()}
function render(){let d=active()?today():{tasks:[],bonus:false,chest:false,game:false},t=totals(),n=dayNum(),count=d.tasks.filter(x=>x.done).length,level=Math.floor(t.xp/500)+1;let html=`<small>YOUR PERSONAL ADVENTURE</small><div class="row"><h1>${esc(s.name)}</h1><span class="tag">Lv. ${level}</span></div><div class="stats"><div class="stat"><small>DAY</small><b>${Math.max(0,Math.min(n,s.duration))}/${s.duration}</b></div><div class="stat"><small>XP</small><b>${t.xp}</b></div><div class="stat"><small>COINS</small><b>🪙 ${t.coins}</b></div></div><div class="bar"><i style="width:${t.xp%500/5}%"></i></div><small>${t.xp%500} / 500 XP to next level</small>${msg?`<div class="notice">${esc(msg)}</div>`:''}`;
if(tab==='Today'){html+=`<section class="card"><div class="row"><h3>Today's quests</h3><span class="tag">${count}/${d.tasks.length}</span></div>${active()?d.tasks.map((x,i)=>`<label class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} ${(x.done&&(d.bonus||d.chest||d.game))?'disabled':''} onchange="toggle(${i})"><span>${esc(x.name)}</span><small>+${x.xp} XP · 🪙${x.coins}</small></label>`).join(''):'<p>Challenge is not active today. Change dates in My Profile.</p>'}<div class="bar"><i style="width:${rate(d)*100}%"></i></div><button class="wide" ${!active()||rate(d)!==1||d.bonus?'disabled':''} onclick="claim('bonus')">${d.bonus?'✓ Daily reward claimed':'Claim daily reward · +30 XP & 20 coins'}</button></section><section class="card"><div class="row"><div><h3>🎁 Daily treasure</h3><small>Complete ${Math.min(4,d.tasks.length)} quests</small></div><button ${!active()||!d.tasks.length||count<Math.min(4,d.tasks.length)||d.chest?'disabled':''} onclick="claim('chest')">${d.chest?'Opened':'Open +20'}</button></div></section>`}
if(tab==='Map'){let passed=0;html+='<section class="card"><h3>Adventure map</h3><p class="muted">Every 5 days is a chapter. Reach 80% of planned tasks to earn its star.</p><div class="map">';for(let i=1;i<=s.duration;i++){let k=new Date(Date.parse(s.start+'T00:00:00Z')+(i-1)*86400000).toISOString().slice(0,10);let r=rate(s.days[k]);html+=`<div class="node ${r>=.8?'passed':''} ${i===n?'current':''}">${r>=.8?'✓':i>n?'🔒':'○'}<br>${i}</div>`}html+='</div></section><section class="card"><h3>Chapter milestones</h3>';let names=['🌱 Seedling forest','🌿 Energy oasis','🌷 Blooming garden','⛰️ Courage hills','🏰 Dream castle'];for(let a=1;a<=s.duration;a+=5){let b=Math.min(a+4,s.duration),sum=0;for(let i=a;i<=b;i++){let k=new Date(Date.parse(s.start+'T00:00:00Z')+(i-1)*86400000).toISOString().slice(0,10);sum+=rate(s.days[k])}let r=sum/(b-a+1);if(r>=.8)passed++;html+=`<div class="shop"><span>${names[Math.min(4,Math.floor((a-1)/10))]}<br><small>Days ${a}–${b}</small></span><span>${r>=.8?'⭐ ':''}${Math.round(r*100)}%</span></div>`}html+=`<p>${passed} chapters cleared</p></section>`}
if(tab==='Garden'){html+=`<section class="card"><h3>My garden · ${s.plants.length}/18</h3><div class="garden">${Array.from({length:Math.max(6,Math.min(18,Math.ceil((s.plants.length+1)/3)*3))},(_,i)=>`<div class="plot">${s.plants[i]||'·'}</div>`).join('')}</div>${plants.map((p,i)=>`<div class="shop"><span>${p[0]} ${p[1]}</span><button ${t.coins<p[2]||s.plants.length>=18?'disabled':''} onclick="buyPlant(${i})">🪙 ${p[2]}</button></div>`).join('')}</section><section class="card"><h3>Memory garden</h3><small>Complete half your daily quests to unlock. Win once per day for 15 coins.</small>${game?`<div class="mini">${game.cards.map((c,i)=>`<button ${game.matched.includes(i)||game.busy?'disabled':''} onclick="flip(${i})">${game.open.includes(i)||game.matched.includes(i)?c:'?'}</button>`).join('')}</div>`:`<button class="wide" ${!active()||d.game||rate(d)<.5?'disabled':''} onclick="startGame()">${d.game?'✓ Won today':'Play memory game'}</button>`}</section>`}
if(tab==='Records'){let r=s.records[dateKey()]||{};html+=`<section class="card"><h3>Daily progress</h3><form onsubmit="record(event)"><div class="two">${[['weight','Weight (kg)'],['run','Run (km)'],['waist','Waist (cm)'],['hips','Hips (cm)'],['chest','Chest (cm)'],['arm','Arm (cm)'],['thigh','Thigh (cm)'],['water','Water (L)']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" min="0" step="0.01" value="${esc(r[k]||'')}"></div>`).join('')}</div><label>Daily journal</label><input name="note" value="${esc(r.note||'')}"><button class="wide">Save record</button></form></section><section class="card"><h3>History</h3>${Object.entries(s.records).sort().reverse().map(([k,v])=>`<div class="log"><b>${esc(k)}</b><br>${Object.entries(v).filter(([a,b])=>b!==''&&b!=null).map(([a,b])=>`${esc(a)}: ${esc(b)}`).join(' · ')}</div>`).join('')||'<small>No records yet.</small>'}</section>`}
if(tab==='Profile'){html+=`<section class="card"><h3>Reward shop</h3>${s.rewards.map((r,i)=>`<div class="shop"><span>${esc(r.name)}</span><button ${t.coins<r.cost?'disabled':''} onclick="redeem(${i})">🪙 ${r.cost}</button></div>`).join('')}<form onsubmit="addReward(event)"><label>Custom reward</label><div class="two"><input name="name" required placeholder="Reward"><input name="cost" type="number" min="1" required placeholder="Coins"></div><button class="wide alt">Add reward</button></form></section><section class="card"><h3>Challenge settings</h3><form onsubmit="settings(event)"><label>Name</label><input name="name" required value="${esc(s.name)}"><label>Start date</label><input name="start" type="date" required value="${esc(s.start)}"><label>Duration (days)</label><input name="duration" type="number" min="1" max="365" required value="${s.duration}"><button class="wide">Save settings</button></form></section><section class="card"><h3>Quest templates</h3><small>Edits apply to future days, not today's saved quests.</small>${s.tasks.map((q,i)=>`<div class="shop"><span>${esc(q.name)}<br><small>${q.xp} XP · ${q.coins} coins</small></span><button class="alt" onclick="removeTask(${i})">Remove</button></div>`).join('')}<form onsubmit="addTask(event)"><label>New quest</label><input name="name" required placeholder="Quest name"><div class="two"><div><label>XP</label><input name="xp" type="number" min="0" max="1000" value="10" required></div><div><label>Coins</label><input name="coins" type="number" min="0" max="1000" value="5" required></div></div><button class="wide alt">Add quest</button></form></section><section class="card"><h3>Backup</h3><p class="muted">Data stays in this browser. Export regularly.</p><button onclick="backup()">Export JSON</button> <button class="alt" onclick="document.getElementById('import').click()">Import</button><input id="import" type="file" accept="application/json,.json" hidden onchange="restore(event)"></section>`}
document.getElementById('app').innerHTML=html;document.getElementById('nav').innerHTML=[['Today','🏡'],['Map','🗺️'],['Garden','🌻'],['Records','📊'],['Profile','👤']].map(([a,b])=>`<button class="${tab===a?'active':''}" onclick="change('${a}')"><b>${b}</b>${a}</button>`).join('');save()}
function record(e){e.preventDefault();s.records[dateKey()]=Object.fromEntries(new FormData(e.target));msg='Record saved';commit()}function addReward(e){e.preventDefault();let f=new FormData(e.target);s.rewards.push({name:f.get('name').trim(),cost:Number(f.get('cost'))});commit()}function settings(e){e.preventDefault();let f=new FormData(e.target);s.name=f.get('name').trim();s.start=f.get('start');s.duration=Number(f.get('duration'));msg='Settings saved';commit()}function addTask(e){e.preventDefault();let f=new FormData(e.target);s.tasks.push({id:Date.now().toString(),name:f.get('name').trim(),xp:Number(f.get('xp')),coins:Number(f.get('coins'))});commit()}function removeTask(i){if(s.tasks.length<=1){msg='Keep at least one quest';render();return}s.tasks.splice(i,1);commit()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='project50-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){try{let x=JSON.parse(await e.target.files[0].text());if(!x||!Array.isArray(x.tasks)||!x.tasks.length||!x.days||!Array.isArray(x.plants)||!Array.isArray(x.spending)||!Array.isArray(x.rewards)||!x.records||!/^\d{4}-\d{2}-\d{2}$/.test(x.start)||!Number.isInteger(x.duration)||x.duration<1||x.duration>365)throw Error();if(confirm('Replace current data with backup?')){s=x;game=null;msg='Backup imported';commit()}}catch{msg='Invalid backup file';render()}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
